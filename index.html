<title>Queue Decision Study</title>
<style>
:root {
    --ink: #17212b; --muted: #5b6670; --line: #d7dee6; --panel: #f6f8fa;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body.modal-open { overflow: hidden; }
body { color: var(--ink); background: #fff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.55; margin: 0; padding: 60px 18px 18px; }
.instr-fab { position: fixed; top: 12px; right: 12px; z-index: 60; display: none; padding: 9px 15px; font-size: .9rem; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }

.instr-panel { position: fixed; top: 0; right: 0; height: 100%; width: 460px; max-width: 94vw; background: #fff; border-left: 1px solid var(--line); box-shadow: -6px 0 24px rgba(0,0,0,.15); z-index: 61; transform: translateX(102%); transition: transform .18s ease; display: flex; flex-direction: column; }
.instr-panel.open { transform: translateX(0); }
.instr-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.instr-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 30px; }
.instr-body .card { margin-bottom: 12px; }
.instr-note { font-size: .85rem; color: var(--muted); margin: 0 0 10px; }
.shell { max-width: 760px; margin: 0 auto; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 22px; background: #fff; margin-bottom: 18px; }
.band { border-left: 4px solid var(--accent); background: var(--panel); padding: 12px 16px; margin: 16px 0; }
.muted { color: var(--muted); }
.formula { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
	.status { display: flex; flex-wrap: wrap; gap: 8px 22px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px 14px; margin-bottom: 14px; font-size: .95rem; }
	.step-progress { margin: 0 0 14px; }
	.step-progress .top { display: flex; justify-content: space-between; gap: 12px; font-size: .85rem; color: var(--muted); margin-bottom: 5px; }
	.step-progress .track { height: 8px; border-radius: 999px; background: #e5eaf0; overflow: hidden; }
	.step-progress .bar { height: 100%; background: var(--accent); width: 0%; }
	button { border: 0; border-radius: 7px; background: var(--accent); color: #fff; padding: 13px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; min-height: 46px; touch-action: manipulation; -webkit-appearance: none; }
button:hover { background: var(--accent-dark); }
button.secondary { background: #475569; }
button.secondary:hover { background: #334155; }
button:disabled { opacity: .5; cursor: default; }
.choices { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.case-label { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; background: var(--panel); }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 12px 0; }
.metric { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--panel); }
.metric strong { display: block; font-size: 1.3rem; }
.q { margin: 16px 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q p { margin: 4px 0 8px; font-weight: 600; }
label.opt { display: flex; align-items: center; gap: 10px; margin: 2px 0; padding: 9px 10px; min-height: 46px; border-radius: 8px; font-weight: 400; cursor: pointer; touch-action: manipulation; }
label.opt:hover, label.opt:active { background: var(--panel); }
label.opt input[type="radio"] { width: 20px; height: 20px; flex: none; margin: 0; }
input[type="number"], select, textarea, input[type="text"] { width: 100%; max-width: 420px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 16px; font-family: inherit; min-height: 46px; }
select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
input[type="number"] { max-width: 140px; }
textarea { max-width: 100%; min-height: 70px; }
	.error { color: var(--warn); font-weight: 700; }
	.quiz-feedback { border: 1px solid #fed7aa; background: #fff7ed; border-radius: 8px; padding: 12px 14px; margin: 14px 0; }
	.quiz-feedback h4 { margin: 0 0 8px; }
	.quiz-feedback .item { margin: 10px 0; }
	.quiz-feedback .item strong { display: block; }
	.timer { font-weight: 700; color: var(--warn); }
	.feedback-good { color: var(--accent-dark); font-weight: 700; }
	.feedback-zero { color: var(--muted); font-weight: 700; }
	.quality-note { font-size: .9rem; color: var(--muted); }
.lang-row { display: flex; gap: 12px; margin-top: 20px; }
.progress { font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
code.big { font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }
@media (max-width: 640px) {
    body { padding: 56px 12px 12px; }
    .card { padding: 16px; }
    .choices button { width: 100%; }
    .instr-panel { width: 100%; max-width: 100%; }
    .instr-fab { top: 8px; right: 8px; padding: 8px 12px; font-size: .85rem; min-height: 40px; }
    .instr-head button { width: auto; min-height: 40px; }
    .status { font-size: .9rem; gap: 6px 14px; }
    .metric-grid { grid-template-columns: 1fr 1fr; }
    /* Keep the two decision buttons reachable without scrolling on small screens. */
    .decision-actions { position: sticky; bottom: 0; z-index: 5; background: #fff; padding: 10px 0 6px; margin-top: 14px; box-shadow: 0 -8px 12px -8px rgba(0,0,0,.25); }
    h2 { font-size: 1.3rem; } h3 { font-size: 1.1rem; }
}
@media (max-width: 380px) { .metric-grid { grid-template-columns: 1fr; } }
</style>

/* ============================ Utilities ============================ */
function fmt(s, map) {
    return s.replace(/\{(\w+)\}/g, function (_, k) { return (k in map) ? map[k] : "{" + k + "}"; });
}
function vnd(x) { return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
	function makeCode() {
	    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out = "QL-";
	    var buf = new Uint32Array(6); crypto.getRandomValues(buf);
	    for (var i = 0; i < 6; i++) out += chars[buf[i] % chars.length];
	    return out;
	}
	function makeSessionId() {
	    var chars = "abcdef0123456789", out = "qs_";
	    var buf = new Uint32Array(16); crypto.getRandomValues(buf);
	    for (var i = 0; i < 16; i++) out += chars[buf[i] % chars.length];
	    return out;
	}
	function queryValue(keys) {
	    var q = new URLSearchParams(window.location.search);
	    for (var i = 0; i < keys.length; i++) {
	        var v = q.get(keys[i]);
	        if (v) return v.slice(0, 120);
	    }
	    return "";
	}
	function externalParticipantId() {
	    return queryValue(["participant_id", "prolific_pid", "PROLIFIC_PID", "worker_id", "workerId", "pid", "id"]);
	}
	function deviceInfo() {
	    return {
	        viewport_width: window.innerWidth, viewport_height: window.innerHeight,
	        screen_width: window.screen ? window.screen.width : "",
	        screen_height: window.screen ? window.screen.height : "",
	        timezone_offset_minutes: new Date().getTimezoneOffset(),
	        platform: navigator.platform || "",
	        hardware_concurrency: navigator.hardwareConcurrency || "",
	        max_touch_points: navigator.maxTouchPoints || 0,
	        user_agent: navigator.userAgent,
	        referrer: document.referrer || ""
	    };
	}
	function progressHtml(step, total, label) {
	    var pct = Math.max(0, Math.min(100, Math.round(step / total * 100)));
	    return '<div class="step-progress"><div class="top"><span>' + label + '</span><span>' + pct + '%</span></div>' +
	        '<div class="track"><div class="bar" style="width:' + pct + '%"></div></div></div>';
	}
	function beliefScore(guess, truth) { return Math.max(0, CONFIG.BELIEF_MAX - Math.abs(guess - truth)); }
function radioBlock(name, qText, options) {
    var html = '<div class="q"><p>' + qText + '</p>';
    options.forEach(function (o) {
        html += '<label class="opt"><input type="radio" name="' + name + '" value="' + o.v + '"> ' + o.t + '</label>';
    });
    return html + '</div>';
}
	function getRadio(name) {
	    var sel = document.querySelector('input[name="' + name + '"]:checked');
	    return sel ? sel.value : null;
	}
	function optionText(options, value) {
	    var hit = options.filter(function (o) { return o.v === value; })[0];
	    return hit ? hit.t : "";
	}
function selectBlock(id, qText, options, placeholder) {
    var html = '<div class="q"><p>' + qText + '</p><select id="' + id + '"><option value="">' + (placeholder || "—") + '</option>';
    options.forEach(function (o) { html += '<option value="' + o.v + '">' + o.t + '</option>'; });
    return html + '</select></div>';
	}
	
	/* ============================ State ============================ */
	var STORAGE_KEY = "queue_capacity_exposure_v3_in_progress";
	var FINAL_STORAGE_KEY = "queue_capacity_exposure_v3_last_completion";
	function makeInitialState() {
	    var a = assignTreatment();
	    return {
	        lang: "vi", t: null,
	        treatment: a.treatment,
	        assignment_source: a.source,
	        url_treatment: a.url_treatment,
	        external_id: externalParticipantId(),
	        session_id: makeSessionId(),
	        code: makeCode(),
	        plan: null,           // {types[]}
	        round: 0,             // 0-based next unpaid or paid round index
	        load: "normal",
	        balance: CONFIG.START_BALANCE,
	        rows: [],             // per-round data
	        quizFails: 0,
	        quizAttempts: [],
	        blurs: 0,
	        hiddenCount: 0,
	        hiddenSeconds: 0,
	        hiddenSince: null,
	        restoreCount: 0,
	        restored: false,
	        instrOpens: 0,
	        instrSeconds: 0,
	        roundInstrOpens: 0,
	        roundInstrSeconds: 0,
	        pausedMs: 0,
	        panelOpen: false,
	        instrOpenAt: null,
	        decisionLocked: false,
	        submitting: false,
	        completed: false,
	        decisionT0: null,
	        decisionStartedAt: null,
	        timerId: null, timeLeft: 0,
	        beliefs: {}, results: {}, quest: {}, demo: {},
	        startedAt: new Date().toISOString(),
	        consentedAt: null
	    };
	}
	var S = makeInitialState();

	function serializableState() {
	    var copy = {};
	    Object.keys(S).forEach(function (k) {
	        if (k !== "t" && k !== "timerId" && k !== "decisionT0" && k !== "hiddenSince" && k !== "instrOpenAt") copy[k] = S[k];
	    });
	    return copy;
	}
	function saveProgress() {
	    if (!S.plan || S.completed) return;
	    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serializableState())); } catch (e) {}
	}
	function clearProgress() {
	    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
	}
	function loadProgress() {
	    try {
	        var raw = localStorage.getItem(STORAGE_KEY);
	        return raw ? JSON.parse(raw) : null;
	    } catch (e) { return null; }
	}
	function saveFinalPayload(payload) {
	    try { localStorage.setItem(FINAL_STORAGE_KEY, payload); } catch (e) {}
	}
	function restoreState(saved) {
	    S = makeInitialState();
	    Object.keys(saved || {}).forEach(function (k) { S[k] = saved[k]; });
	    S.t = T[S.lang] || T.vi;
	    S.timerId = null;
	    S.decisionT0 = null;
	    S.hiddenSince = null;
	    S.submitting = false;
	    S.decisionLocked = false;
	    S.panelOpen = false;
	    S.instrOpenAt = null;
	    S.pausedMs = 0;
	    S.restored = true;
	    S.restoreCount = (S.restoreCount || 0) + 1;
	    if (S.rows && S.rows.length > S.round) S.round = S.rows.length;
	    saveProgress();
	}
	window.addEventListener("blur", function () { S.blurs += 1; saveProgress(); });
	document.addEventListener("visibilitychange", function () {
	    if (document.hidden) {
	        S.hiddenCount += 1;
	        S.hiddenSince = Date.now();
	    } else if (S.hiddenSince) {
	        var away = Date.now() - S.hiddenSince;
	        S.hiddenSeconds += Math.round(away / 1000);
	        S.hiddenSince = null;
	        // Smartphone fairness: an incoming call or app switch must not silently
	        // consume the decision window. Time away from the page is credited back
	        // to the round clock, capped so the timer still protects the session
	        // against abandonment. Credited time is excluded from response time.
	        if (S.decisionT0 !== null && !S.decisionLocked) {
	            S.pausedMs += Math.min(away, HIDDEN_PAUSE_CAP_MS);
	        }
	        saveProgress();
	    }
	});
	window.addEventListener("beforeunload", function (e) {
	    if (S.plan && !S.completed) {
	        saveProgress();
	        e.preventDefault();
	        e.returnValue = "";
	    }
});

function buildPlan() {
    // I.i.d. draws: each case is Type H with probability H_PROB, so the
    // stated 40% is exactly true at every information set, in every
    // treatment, even after payoff feedback reveals past case types.
    var types = [], i;
    for (i = 0; i < CONFIG.NUM_ROUNDS; i++) {
        types.push(Math.random() < CONFIG.H_PROB ? "H" : "L");
    }
    return { types: types };
}

	function assignTreatment() {
	    var q = new URLSearchParams(window.location.search);
	    var forced = (q.get("t") || "").toLowerCase();
	    if (forced === "mixed" || forced === "fine" || forced === "state") {
	        return { treatment: forced === "state" ? "state_dependent" : forced, source: "url_forced", url_treatment: forced };
	    }
	    var r = Math.random();
	    return { treatment: r < 1 / 3 ? "mixed" : (r < 2 / 3 ? "fine" : "state_dependent"), source: "random", url_treatment: forced };
	}

function displayLabel(r, load) {
    var type = S.plan.types[r], currentLoad = load || S.load;
    if (S.treatment === "mixed") return "mixed";
    if (S.treatment === "fine") return type;
    return currentLoad === "normal" ? type : "mixed";
}

function waitCost(load) {
    return load === "normal" ? CONFIG.WAIT_LOW : CONFIG.WAIT_HIGH;
}

function loadLabel(load) {
    return load === "normal" ? S.t.load_normal : S.t.load_strained;
}

function socialValue(type, served) {
    if (!served) return 0;
    return type === "H" ? CONFIG.SOCIAL_VALUE_H : CONFIG.SOCIAL_VALUE_L;
}

function nextLoadAfter(type, served, currentLoad) {
    var highBurdenServed = served && type === "H";
    if (highBurdenServed) {
        return { nextLoad: "strained", recovered: false, recovery_draw: null };
    }
    if (currentLoad === "strained") {
        var draw = Math.random();
        return { nextLoad: draw < CONFIG.RECOVERY_PROB ? "normal" : "strained", recovered: draw < CONFIG.RECOVERY_PROB, recovery_draw: draw };
    }
    return { nextLoad: "normal", recovered: false, recovery_draw: null };
}

/* ================= Persistent instructions reference =================
   The instructions remain available on every screen, exactly as printed
   instructions stay on the desk in a laboratory session. The panel is
   built from the same translation keys as the instructions screen, so
   the two can never diverge, and its content does not condition on the
   treatment. Consulting it is costless in time: the decision countdown
   pauses while the panel is open (capped, to bound stalling), so that
   reference use cannot create differential time pressure across arms.
   Consultation is logged (counts and seconds, per round and in total)
   as an attention and comprehension covariate.                        */
var INSTR_PAUSE_CAP_MS = 120000;
var HIDDEN_PAUSE_CAP_MS = 120000;
var instrWatchdog = null;

function instructionParams() {
    return {
        N: CONFIG.NUM_ROUNDS, START: CONFIG.START_BALANCE, H: CONFIG.H_VALUE, L: CONFIG.L_VALUE,
        EV: CONFIG.MIXED_EV, WL: CONFIG.WAIT_LOW, WH: CONFIG.WAIT_HIGH,
        RP: Math.round(CONFIG.RECOVERY_PROB * 100),
        HN: CONFIG.H_VALUE - CONFIG.WAIT_LOW,
        MN: CONFIG.MIXED_EV - CONFIG.WAIT_LOW,
        HS: CONFIG.H_VALUE - CONFIG.WAIT_HIGH,
        MS: CONFIG.MIXED_EV - CONFIG.WAIT_HIGH
    };
}

function instructionsBodyHtml() {
    var t = S.t, m = instructionParams();
    return '<div class="card"><h3>' + t.inst1_title + '</h3><p>' + fmt(t.inst1_body, m) + '</p></div>' +
        '<div class="card"><h3>' + t.inst2_title + '</h3><p>' + fmt(t.inst2_body, m) + '</p></div>' +
        '<div class="card"><h3>' + t.inst3_title + '</h3><p>' + fmt(t.inst3_body, m) + '</p>' +
        '<div class="formula">' + (S.lang === "vi" ? "Điểm = giá trị hồ sơ − chi phí chờ hiện tại" : "Points = case value − current waiting cost") + '</div></div>' +
        '<div class="card"><h3>' + t.inst4_title + '</h3><p>' + fmt(t.inst4_body, m) + '</p></div>' +
        '<div class="card"><h3>' + t.inst5_title + '</h3><p>' + fmt(t.inst5_body, m) + '</p></div>';
}

function ensureInstructionsUI() {
    if (document.getElementById("instr_fab")) return;
    var fab = document.createElement("button");
    fab.id = "instr_fab"; fab.className = "instr-fab"; fab.type = "button";
    fab.setAttribute("aria-haspopup", "dialog");
    fab.onclick = openInstructions;
    document.body.appendChild(fab);
    var back = document.createElement("div");
    back.id = "instr_backdrop"; back.className = "instr-backdrop";
    back.onclick = closeInstructions;
    document.body.appendChild(back);
    var panel = document.createElement("div");
    panel.id = "instr_panel"; panel.className = "instr-panel";
    panel.setAttribute("role", "dialog");
    document.body.appendChild(panel);
    document.addEventListener("keydown", function (e) {
        if ((e.key === "Escape" || e.keyCode === 27) && S.panelOpen) closeInstructions();
    });
}

function refreshInstructionsUI() {
    if (!S.t) return;
    ensureInstructionsUI();
    var fab = el("instr_fab");
    if (fab) { fab.textContent = S.t.instructions_button; fab.style.display = "block"; }
}

function currentPauseMs() {
    return S.panelOpen && S.instrOpenAt !== null ? (performance.now() - S.instrOpenAt) : 0;

function openInstructions() {
    if (!S.t || S.panelOpen) return;
    ensureInstructionsUI();
    S.panelOpen = true;
    S.instrOpenAt = performance.now();
    S.instrOpens += 1;
    S.roundInstrOpens += 1;
    var panel = el("instr_panel");
    panel.innerHTML = '<div class="instr-head"><strong>' + S.t.instructions_panel_title + '</strong>' +
        '<button type="button" id="instr_close" class="secondary">' + S.t.instr_close + '</button></div>' +
        '<div class="instr-body"><p class="instr-note">' + S.t.instr_panel_note + '</p>' +
        instructionsBodyHtml() + '</div>';
    var closeBtn = el("instr_close");
    if (closeBtn) closeBtn.onclick = closeInstructions;
    panel.classList.add("open");
    el("instr_backdrop").classList.add("open");
    if (document.body.classList) document.body.classList.add("modal-open");
    instrWatchdog = setInterval(function () {
        if (currentPauseMs() > INSTR_PAUSE_CAP_MS) closeInstructions();
    }, 1000);
    saveProgress();
}

function closeInstructions() {
    if (!S.panelOpen) return;
    var open = currentPauseMs();
    S.panelOpen = false;
    S.instrOpenAt = null;
    if (instrWatchdog) { clearInterval(instrWatchdog); instrWatchdog = null; }
    S.pausedMs += open;
    S.instrSeconds += Math.round(open / 1000);
    S.roundInstrSeconds += Math.round(open / 1000);
    var panel = el("instr_panel"), back = el("instr_backdrop");
    if (panel) panel.classList.remove("open");
    if (back) back.classList.remove("open");
    if (document.body.classList) document.body.classList.remove("modal-open");
    saveProgress();
}

function screenDecision() {
    var t = S.t, r = S.round;
    S.decisionLocked = false;
    var currentLoad = S.load;
    var label = displayLabel(r, currentLoad), cost = waitCost(currentLoad);
    var isMixed = label === "mixed";
    var value = label === "H" ? CONFIG.H_VALUE : CONFIG.L_VALUE;
    var evIfServed = isMixed
        ? CONFIG.MIXED_EV - cost
        : value - cost;
    var labelText = isMixed ? t.case_mixed : (label === "H" ? t.case_h : t.case_l);
    var caseText = isMixed
        ? fmt(t.mixed_text, { EV: CONFIG.MIXED_EV })
        : (label === "H" ? fmt(t.h_text, { H: CONFIG.H_VALUE }) : fmt(t.l_text, { L: CONFIG.L_VALUE }));
    var evLine = isMixed
        ? fmt(t.ev_line_mixed, { EV: CONFIG.MIXED_EV, W: cost, X: evIfServed })
        : fmt(t.ev_line_exact, { V: value, W: cost, X: evIfServed });

	    show(
	        progressHtml(5, 8, t.progress_rounds) +
	        '<div class="status"><span>' + t.round + ' <strong>' + (r + 1) + ' / ' + CONFIG.NUM_ROUNDS + '</strong></span>' +
        '<span>' + t.balance + ': <strong>' + S.balance + '</strong></span>' +
        '<span>' + t.load + ': <strong>' + loadLabel(currentLoad) + '</strong></span>' +
        '<span class="timer">' + t.time_left + ' <span id="clock">' + CONFIG.DECISION_SECONDS + '</span>s</span></div>' +
        '<div class="card">' +
        '<p><span class="case-label">' + labelText + '</span></p>' +
        '<p>' + caseText + '</p>' +
        '<div class="formula">' + evLine + '</div>' +
        '<div class="band">' + t.units_line + ' <strong>' + loadLabel(currentLoad) + '</strong><br>' +
        fmt(t.charge_line, { W: cost }) + '</div>' +
        '<p><strong>' + t.choose + '</strong></p>' +
        '<div class="choices decision-actions">' +
        '<button id="btn_send">' + t.send + '</button>' +
        '<button id="btn_not" class="secondary">' + t.not_send + '</button>' +
        '</div>' +
        '<p class="muted">' + t.timeout_note + '</p>' +
        '</div>'
    );
	
	    S.decisionT0 = performance.now();
	    S.decisionStartedAt = new Date().toISOString();
	    S.roundInstrOpens = 0;
	    S.roundInstrSeconds = 0;
	    S.pausedMs = 0;
	    var blursBefore = S.blurs;
	    S.timeLeft = CONFIG.DECISION_SECONDS;
	    saveProgress();
    S.timerId = setInterval(function () {
        // Never expire while the page is hidden; mobile browsers freeze and
        // throttle timers, and the away time is credited on return.
        if (document.hidden) return;
        // Derive remaining time from the elapsed clock so background-tab
        // timer throttling cannot stretch the decision window.
        var elapsed = Math.floor((performance.now() - S.decisionT0 - S.pausedMs - currentPauseMs()) / 1000);
        S.timeLeft = Math.max(0, CONFIG.DECISION_SECONDS - elapsed);
        var c = el("clock");
        if (c) c.textContent = S.timeLeft;
        if (S.timeLeft <= 0) { decide(null, true, blursBefore); }
    }, 500);

    el("btn_send").onclick = function () { decide("send", false, blursBefore); };
    el("btn_not").onclick = function () { decide("not_send", false, blursBefore); };
}

function decide(choice, timedOut, blursBefore) {
    if (S.decisionLocked) return;
    S.decisionLocked = true;
    clearInterval(S.timerId);
    var sendBtn = el("btn_send"), notBtn = el("btn_not");
    if (sendBtn) sendBtn.disabled = true;
    if (notBtn) notBtn.disabled = true;
    var r = S.round;
    var pausedTotal = S.pausedMs + currentPauseMs();
    var rt = timedOut ? null : Math.round(performance.now() - S.decisionT0 - pausedTotal) / 1000;
    var decision = timedOut ? "not_send" : choice;
    var type = S.plan.types[r], currentLoad = S.load, cost = waitCost(currentLoad);
    var served = false, points = 0;
    if (decision === "send") {
        served = true;
        points = (type === "H" ? CONFIG.H_VALUE : CONFIG.L_VALUE) - cost;
    }
    var transition = nextLoadAfter(type, served, currentLoad);
    var highBurdenServed = served && type === "H";
    var noncapacityValue = socialValue(type, served);
    var fatigueCost = currentLoad === "strained" ? CONFIG.FATIGUE_COST_HIGH : 0;
    var socialScore = noncapacityValue - fatigueCost;
    S.balance += points;
	    S.rows.push({
	        round: r + 1, actual_type: type, display_label: displayLabel(r, currentLoad),
	        capacity_before: currentLoad, wait_cost: cost,
	        decision_started_at: S.decisionStartedAt,
	        decision: decision, timed_out: timedOut, rt_seconds: rt,
        blur_count: S.blurs - blursBefore,
        instr_opens: S.roundInstrOpens,
        instr_seconds: S.roundInstrSeconds + Math.round(currentPauseMs() / 1000),
        served: served, high_burden_served: highBurdenServed,
        recovered: transition.recovered, recovery_draw: transition.recovery_draw,
        capacity_after: transition.nextLoad,
        points: points, social_value: noncapacityValue,
        fatigue_cost: fatigueCost, social_score: socialScore,
        theorem_cost: fatigueCost - noncapacityValue,
        balance_after: S.balance
	    });
	    S.load = transition.nextLoad;
	    saveProgress();
	    screenFeedback(timedOut, decision, served, points, transition.nextLoad);
}

function screenFeedback(timedOut, decision, served, points, nextLoad) {
    var t = S.t, msg, cls;
    var m = { X: points, LOAD: loadLabel(nextLoad) };
    if (timedOut) { msg = fmt(t.fb_timeout, m); cls = "feedback-zero"; }
    else if (decision === "not_send") { msg = fmt(t.fb_notsent, m); cls = "feedback-zero"; }
    else if (served) { msg = fmt(t.fb_served, m); cls = points >= 0 ? "feedback-good" : "feedback-zero"; }
    else { msg = fmt(t.fb_unserved, m); cls = "feedback-zero"; }
    var last = S.round === CONFIG.NUM_ROUNDS - 1;
    show(
        '<div class="status"><span>' + t.round + ' <strong>' + (S.round + 1) + ' / ' + CONFIG.NUM_ROUNDS + '</strong></span>' +
        '<span>' + t.balance + ': <strong>' + S.balance + '</strong></span></div>' +
        '<div class="card"><p class="' + cls + '">' + msg + '</p>' +
        '<button id="next">' + (last ? t.to_beliefs : t.next_round) + '</button></div>'
    );
	    el("next").onclick = function () {
	        S.round += 1;
	        saveProgress();
	        if (S.round < CONFIG.NUM_ROUNDS) screenDecision(); else screenBeliefs();
	    };
}

	        language: S.lang,
	        started_at: S.startedAt,
	        consented_at: S.consentedAt,
	        finished_at: finished.toISOString(),
	        elapsed_seconds: Math.round((finished.getTime() - new Date(S.startedAt).getTime()) / 1000),
	        comprehension_failures: S.quizFails,
	        comprehension_attempt_log: S.quizAttempts,
	        total_blurs: S.blurs,
	        hidden_count: S.hiddenCount,
	        hidden_seconds: hiddenSecondsNow(),
	        instr_opens_total: S.instrOpens,
	        instr_seconds_total: S.instrSeconds + Math.round(currentPauseMs() / 1000),
	        restored: S.restored,
	        restore_count: S.restoreCount,
	        endpoint_configured: CONFIG.ENDPOINT_URL.indexOf("http") === 0,
	        device: deviceInfo(),
	        beliefs: S.beliefs,
	        results: S.results,
        questionnaire: S.quest,
        demographics: S.demo,
        rounds: S.rows
    };
}

	function submitData() {
    if (S.submitting) return;
    S.submitting = true;
	    var t = S.t;
	    show(progressHtml(8, 8, t.progress_done) + '<div class="card"><p>' + t.sending + '</p></div>');
    var payload = JSON.stringify(buildPayload());
    var finish = function () { screenDone(payload); };
    if (CONFIG.ENDPOINT_URL.indexOf("http") === 0) {
        // Apps Script web apps accept cross-origin POSTs with a simple
        // text/plain body; the response is opaque, so we show the fallback
        // data on the final screen regardless.
        fetch(CONFIG.ENDPOINT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: payload
        }).then(finish).catch(finish);
        setTimeout(finish, 6000); // safety: never strand the participant
    } else {
        finish();
    }
}

var doneShown = false;
function screenDone(payload) {
    if (doneShown) return;
    doneShown = true;
	    S.completed = true;
	    saveFinalPayload(payload);
	    clearProgress();
	    var t = S.t;
	    show(
	        progressHtml(8, 8, t.progress_done) +
	        '<div class="card"><h3>' + t.done_title + '</h3>' +
	        '<p>' + t.done_body + '</p>' +
	        '<p><code class="big">' + S.code + '</code></p>' +
	        '<p>' + fmt(t.done_keep, { FIXED: vnd(CONFIG.FIXED_VND), BONUS: vnd(S.results.bonus_vnd) }) + '</p>' +
	        '<div class="band quality-note">' + (CONFIG.ENDPOINT_URL.indexOf("http") === 0 ? t.upload_attempted : t.upload_missing) + '</div>' +
	        '<details><summary class="muted">' + t.fallback + '</summary>' +
	        '<textarea id="raw" style="min-height:120px">' + esc(payload) + '</textarea>' +
	        '<p><button id="copy" class="secondary">' + t.copy + '</button> <span id="copied" class="muted" style="display:none">' + t.copied + '</span></p></details>' +
	        '</div>'
	    );
	    el("copy").onclick = function () {
	        var ta = el("raw");
	        ta.focus();
	        if (ta.setSelectionRange) { ta.select(); ta.setSelectionRange(0, 999999); } else { ta.select(); }
	        var ok = false;
	        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
	        if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
	            navigator.clipboard.writeText(ta.value);
	        }
	        el("copied").style.display = "inline";
	    };
	}

	/* ============================ Boot ============================ */
	var savedProgress = loadProgress();
	if (savedProgress && savedProgress.plan && !savedProgress.completed) {
	    restoreState(savedProgress);
	    screenRecovery();
	} else {
	    screenLanguage();
	}
	</script>
</body>
</html>
